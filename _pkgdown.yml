url: https://afsc-assessments.github.io/Rceattle/

template:
  bootstrap: 5
  bslib:
    primary: "#1a5276"
    secondary: "#2e86c1"
    link-color: "#1a5276"
    navbar-bg: "#1a5276"
    navbar-light-color: "#ffffff"
    navbar-light-active-color: "#aed6f1"
    navbar-light-hover-color: "#aed6f1"
    base_font: {google: "Source Sans Pro"}
    heading_font: {google: "Source Sans Pro"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: "0.97rem"

home:
  title: "Rceattle — Multispecies Stock Assessment in R"
  description: >
    An R package implementing the CEATTLE multispecies age-structured assessment
    model using TMB. Supports single- and multi-species models with climate
    linkages, predation, management strategy evaluation (MSE), and diagnostics.
  links:
  - text: Browse source code
    href: https://github.com/afsc-assessments/Rceattle
  - text: Report a bug
    href: https://github.com/afsc-assessments/Rceattle/issues

navbar:
  bg: primary
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/introduction.html
    articles:
      text: Articles
      menu:
      - text: "--- Getting Started ---"
      - text: "Introduction"
        href: articles/introduction.html
      - text: "Building a data object without Excel"
        href: articles/data-without-excel.html
      - text: "--- Model options ---"
      - text: "Overview of model options and functionality"
        href: articles/model-options-and-functionality.html
      - text: "Single- vs. multi-species models"
        href: articles/single-vs-multispecies.html
      - text: "Growth estimation"
        href: articles/growth-estimation.html
      - text: "Environmental linkages and priors"
        href: articles/environmental-linkages-and-priors.html
      - text: "--- Diagnostics & Inference ---"
      - text: "Model diagnostics"
        href: articles/model-diagnostics.html
      - text: "--- Projections & MSE ---"
      - text: "Projections and reference points"
        href: articles/projections-and-reference-points.html
      - text: "HCRs and MSEs"
        href: articles/hcrs-and-mses.html
      - text: "--- Reference ---"
      - text: "Model parameterizations"
        href: articles/model-parameterizations.html
      - text: "Converting from Stock Synthesis"
        href: articles/stock-synthesis-conversion.html
      - text: "--- Contributing ---"
      - text: "Developer guide"
        href: articles/developer-guide.html
      - text: "Adding a selectivity form"
        href: articles/adding-a-selectivity-form.html
      - text: "C++ template reference"
        href: cpp/index.html
    github:
      icon: fab fa-github
      href: https://github.com/afsc-assessments/Rceattle
      aria-label: GitHub

articles:
- title: Getting Started
  navbar: Getting started
  contents:
  - introduction
  - data-without-excel
  - model-options-and-functionality

- title: Model Types
  desc: >
    Choosing between single- and multi-species model configurations, and
    migrating from other assessment platforms.
  contents:
  - single-vs-multispecies
  - stock-synthesis-conversion

- title: Diagnostics and Inference
  desc: >
    Checking model fit, retrospective patterns, and optimiser stability.
  contents:
  - model-diagnostics
  - growth-estimation

- title: Projections and MSE
  desc: >
    Forward projections under alternative harvest strategies and closed-loop
    management strategy evaluation.
  contents:
  - projections-and-reference-points
  - hcrs-and-mses

- title: Reference
  desc: Model parameterizations, equations, and switch settings.
  contents:
  - model-parameterizations
  - environmental-linkages-and-priors

- title: Contributing
  desc: >
    Extending and maintaining the package internals. The C++ template reference
    (Doxygen, built from src/TMB/) is linked from the navbar.
  contents:
  - articles/developer-guide
  - articles/adding-a-selectivity-form

reference:
- title: "Data input / output"
  desc: Read, write, build, and manipulate Rceattle data lists.
  contents:
  - build_data
  - data_requirements
  - model_config
  - read_data
  - write_data
  - write_template
  - clean_data
  - combine_data
  - rearrange_data

- title: "Model setup"
  desc: Build parameter lists, map objects, bounds, and biological inputs.
  contents:
  - build_params
  - build_map
  - build_bounds
  - build_M1
  - build_growth
  - build_srr
  - build_selectivity
  - build_catchability
  - build_composition
  - build_hcr
  - build_hcr_map
  - fit_control
  - linkage_spec

- title: "Run configuration"
  desc: >
    Save, load, and inspect the full model + estimation setup as a YAML run
    configuration.
  contents:
  - save_config
  - load_config
  - run_config

- title: "Map helpers"
  desc: Low-level helpers called by `build_map()` to configure parameter estimation.
  contents:
  - adjust_map_shared_params
  - build_map_catchability
  - build_map_debug
  - build_map_f_and_data_weights
  - build_map_fixed_natage
  - build_map_growth
  - build_map_m1
  - build_map_predation
  - build_map_recruitment
  - build_map_selectivity

- title: "Model fitting"
  desc: Fit single- or multi-species CEATTLE models and manage output.
  contents:
  - fit_mod
  - reweight_comps
  - set_phases
  - TMBphase
  - TMBAIC
  - model_average
  - rename_output
  - parameter_dictionary
  - parameter_index
  - quantity_dictionary
  - report_tables
  - standard_output

- title: "Projections and MSE"
  desc: >
    Forward projections under alternative harvest strategies and closed-loop
    management strategy evaluation.
  contents:
  - run_mse
  - load_mse
  - check_mse
  - mse_summary
  - remove_F
  - sample_rec

- title: "Diagnostics and simulation"
  desc: Retrospective analysis, jitter testing, residual diagnostics, and simulation.
  contents:
  - convergence_diagnostics
  - osa_residuals
  - osa_diagnostics
  - process_residuals
  - retrospective
  - jitter
  - profile.Rceattle
  - profile_components
  - self_test
  - sim_mod
  - simulate.Rceattle
  - compare_sim
  # The print methods that carry the shared display contract. They document
  # arguments of their own -- print(retro, band = ), print(jit, tol = ) -- so
  # they are reference topics, not just dispatch.
  - print.Rceattle_retro
  - print.Rceattle_jitter
  - print.Rceattle_selftest
  - print.Rceattle_profile
  - print.Rceattle_mse_summary

- title: "Diagnostics — shared arguments"
  desc: >
    The common vocabulary retrospective(), jitter() and self_test() share:
    object, cores and fit_control, and what fit_control() reaches through a
    refit.
  contents:
  - rceattle-refit-args

- title: "Plotting — shared arguments"
  desc: >
    The common vocabulary the timeseries, predation and selectivity plotters
    share: line_col, lwd, lty, alpha, species, spnames, minyr/maxyr, incl_proj,
    incl_mean, add_ci and model_names.
  contents:
  - rceattle-plot-args

- title: "Plotting — population dynamics"
  desc: Visualize biomass, recruitment, SSB, and depletion trajectories.
  contents:
  - plot_timeseries
  - plot_biomass
  - plot_ssb
  - plot_recruitment
  - plot_depletion
  - plot_depletionSSB
  - plot_exploitable_biomass

- title: "Plotting — fishing and natural mortality"
  desc: Visualize fishing mortality, catch, and total mortality.
  contents:
  - plot_catch
  - plot_f
  - plot_mortality
  - plot_m_at_age
  - plot_m2_at_age_prop

- title: "Plotting — surveys and fit"
  desc: Visualize survey indices, fits, and residuals.
  contents:
  - plot_index
  - plot_indexresidual
  - plot_catchability
  - plot_comp
  - plot_profile
  - plot.Rceattle_profile
  - plot.rceattle_osa
  - plot_data
  - plot_form

- title: "Plotting — predation and diet"
  desc: Visualize predation mortality, rations, and diet composition.
  contents:
  - plot_b_eaten
  - plot_b_eaten_prop
  - plot_diet_comp
  - plot_diet_comp1
  - plot_diet_comp2
  - plot_ration

- title: "Plotting — biology"
  desc: Visualize selectivity, maturity, and stock-recruitment.
  contents:
  - plot_selectivity
  - plot_selectivity_vs_maturity
  - plot_maturity
  - plot_stock_recruit

- title: "Example datasets"
  desc: >
    Built-in data lists for the Bering Sea (BS), Gulf of Alaska (GOA),
    Georges Bank, and other applications.
  contents:
  - BS2017SS
  - BS2017MS
  - EBS_ss_run
  - EBS_ss_M_run
  - EBS_ms_run
  - GOA2018SS
  - GOApollock
  - GOAsafe2018
  - GOAatf
  - GOAatf2023
  - GOAcod
  - GeorgesBank3spp
  - NorthernRockfish2022
  - Atka2022
  - whamGrowthData

- title: "Miscellaneous"
  desc: S3 methods, utility functions, and internal helpers.
  contents:
  - print.Rceattle
  - summary.Rceattle
  - print.summary.Rceattle
  - print.Rceattle_data
  - print.rceattle_report
  - switch_check
  - get_growth_matrix_r
  - get_weight_at_age_r
  - rich.colors.short
  - as.data.frame.Rceattle
  - coef.Rceattle
  - logLik.Rceattle
  - plot.Rceattle
  - residuals.Rceattle
  - vcov.Rceattle
  - prior_beta
  - prior_gamma
  - prior_lognormal
  - prior_normal

- title: "Deprecated"
  desc: >
    Superseded functions kept for backward compatibility. They still work but
    emit a deprecation message; use the named replacement in new code.
  contents:
  - plot_logindex
  - plot_ssb_depletion
