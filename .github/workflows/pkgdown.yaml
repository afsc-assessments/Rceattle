on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write
  pages: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Observed successful runs are ~19 minutes; see the note in R-CMD-check.yaml
    # for why an explicit ceiling matters on the Ubuntu runners.
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # See R-CMD-check.yaml: an unused third-party apt repo serving a bad index
      # makes every later apt-get install exit 100, setup-r's included.
      - name: Drop unused third-party apt repositories
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies for TMB
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgsl-dev \
            libblas-dev \
            liblapack-dev \
            gfortran \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            doxygen

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PAK_VERBOSE: true
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # After the site build, which empties docs/ first. Doxyfile writes docs/cpp/,
      # the "C++ template reference" link in the site's Contributing menu.
      - name: Build the C++ template reference
        run: doxygen Doxyfile

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
