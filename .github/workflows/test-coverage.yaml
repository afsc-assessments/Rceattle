# Code-coverage workflow (covr -> Codecov), mirroring NOAA
# `ghactions4r::use_calc_coverage()` but inlined and patched for this TMB
# package. Two patches are essential and cannot be passed to ghactions4r's
# hosted reusable workflow:
#   1. NOT_CRAN=true   -- so the fit_mod() integration tests (which carry
#                         skip_on_cran()) actually RUN and count toward
#                         coverage. Without it covr would measure only the
#                         fast unit tests (the "skipped tests affect coverage"
#                         problem from discussion #75).
#   2. TMB system deps -- the same apt packages the R-CMD-check workflow
#                         installs, so the package compiles on the runner.
# Coverage runs the full NOT_CRAN fit_mod suite under covr, SHARDED across runners
# (see `strategy.matrix` below and tools/ci/coverage-shard.R). Triggers:
#   - push to main / dev  -- gives Codecov a report attributed to those branches, which
#     updates the badge/trend and is the BASE that PR coverage diffs compare against;
#   - pull_request        -- the per-PR Codecov coverage diff;
#   - workflow_dispatch   -- on demand.
# Feature-branch pushes are covered by their PR run (plus cancel-in-progress), so they
# do not trigger it. A shard fails when any of its tests fails or errors, after its
# coverage report is written, and the Codecov upload still runs. These shard
# contexts are NOT among the six the "Require the guards before merging" ruleset
# requires, so a red shard advises rather than blocks -- add them there to gate.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

name: test-coverage

permissions: read-all

# Coverage runs the full NOT_CRAN suite under covr instrumentation and serially, so
# a single runner is long. Cancel superseded runs on the same ref so a re-trigger
# doesn't queue redundant jobs.
concurrency:
  group: test-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    # Each shard runs a weight-balanced slice of tests/testthat and uploads its own
    # cobertura report; Codecov merges uploads carrying the same commit SHA, so the
    # per-PR diff and the badge see one combined report. Wall-clock is the slowest
    # shard, not the sum.
    #
    # Sharding replaced a single serial job that ran out of budget: on PR #109 it was
    # cancelled at ~116 minutes of test_check() with nothing having failed. Serial
    # (TESTTHAT_PARALLEL=false below) is required for correctness -- covr's counters
    # are per-process -- so splitting across runners is the only lever left. The TMB
    # model is kept at -O2 under covr (src/TMB/compile.R drops covr's -O0 coverage
    # flags for that one C++ unit, which covr never reports on anyway), so fits
    # already run at production speed.
    #
    # fail-fast: false so one shard's failure still lets the others upload their
    # share of the coverage.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    # Six shards, and add shards rather than minutes if this trips again. The
    # static cost proxy in coverage-shard.R mis-ranks files badly: at four shards
    # it split the suite into runs of 18, 26, 94 and 12 minutes, and the shard it
    # called heaviest was the second-fastest of the four. Two extra runners buy
    # headroom while the per-file timings written below collect the real numbers
    # to replace the proxy with.
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"   # run the full suite (see header)
      # Force testthat serial under covr (overrides DESCRIPTION
      # `Config/testthat/parallel: true`). Two reasons, both essential here:
      #   1. Correctness -- covr's line counters are per-process, so coverage
      #      executed inside parallel worker processes is never merged back and
      #      goes uncounted. Serial is the supported covr configuration.
      #   2. Stability -- testthat marshals each worker's results back to the
      #      parent by serializing them; the heavy fit/MSE files build
      #      multi-GB fitted objects, and a worker payload can exceed R's ~2 GB
      #      single-string limit, aborting the run with
      #      "result string is too long" in the unserialize path.
      # R-CMD-check does not set this, so it stays parallel and fast.
      TESTTHAT_PARALLEL: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for TMB (Linux)
        run: |
          # See R-CMD-check.yaml: an unused third-party apt repo serving a bad
          # index makes apt-get exit 100 and fails this step.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            libgsl-dev \
            libblas-dev \
            liblapack-dev \
            gfortran \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      # Which machine produced these numbers -- this job pins fitted values.
      # See tools/ci/machine-fingerprint.sh.
      - name: Machine fingerprint
        run: bash tools/ci/machine-fingerprint.sh
        shell: bash

      # The script picks this shard's files, runs them under covr, and writes
      # cobertura.xml. It prints the whole shard plan up front, and writes a
      # per-file elapsed time to COV_TIMING_LOG as each file ends.
      #
      # The timings go to a file rather than the console because covr runs the
      # suite in a subprocess and only surfaces its output when that returns, so
      # a cancelled shard's log jumps straight from "* DONE (Rceattle)" to "The
      # operation was canceled" with no indication of what it was doing. A file
      # is on disk either way, and the upload below is `if: always()` so a
      # cancelled shard still reports.
      - name: Test coverage (shard ${{ matrix.shard }})
        env:
          COV_SHARD: ${{ matrix.shard }}
          # Derived from the matrix, so adding a shard above is the only edit needed.
          COV_SHARDS: ${{ strategy.job-total }}
          COV_TIMING_LOG: ${{ runner.temp }}/coverage-timing-shard-${{ matrix.shard }}.tsv
        run: Rscript tools/ci/coverage-shard.R

      # !cancelled(): a shard with a failing test still uploads its coverage.
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          # Never fail the build on a coverage-upload error: the CODECOV_TOKEN
          # secret may not be configured (and is unavailable on fork PRs), and a
          # missing coverage upload should not turn the whole run red.
          fail_ci_if_error: false
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          # Distinguish the four uploads. Codecov combines reports that share a
          # commit SHA, so the merged report is the whole suite; without a distinct
          # name the shards are hard to tell apart when one fails to upload.
          name: shard-${{ matrix.shard }}

      # always(), not failure(): the run this exists for is the one the timeout
      # cancels, and a cancelled job is not a failed one. This is the table that
      # replaces the static COST_* proxy in tools/ci/coverage-shard.R.
      - name: Upload per-file timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-timing-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-timing-shard-${{ matrix.shard }}.tsv
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # actions/upload-artifact@v4 requires a unique name per matrix job.
          name: coverage-test-failures-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/package
