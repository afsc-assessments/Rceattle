# The three checks nothing else runs.
#
# 1. GOLDEN REFERENCE. tests/testthat/test-golden-regression.R is the committed
#    backstop for "a numeric change needs golden equivalence" -- and it is
#    guarded by BOTH skip_on_cran() and skip_on_covr(), so it fires in neither
#    other job: R-CMD-check sets NOT_CRAN=false deliberately (to keep the
#    multi-OS matrix fast), and test-coverage runs under covr. Without this job
#    the repo's own rule would run only when someone typed /golden-check
#    locally. This job is where it runs: nightly, and since 5.64.0 on every PR
#    that touches the model or the golden files (see the paths filter below).
#
# 2. ARRAY BOUNDS. The model is built with safebounds = FALSE, so an
#    out-of-range access is a silent write into adjacent memory. 5.15.0 fixed
#    exactly such a write (age_hat sized from comp_obs), and R CMD check on
#    windows-latest has died once with 0xC0000005 -- an access violation --
#    inside test-selectivity-catchability.R. tools/verify/verify-safebounds.R
#    rebuilds with bounds checking on so that class of fault is attributable
#    rather than a mystery segfault.
#
# 3. THE skip_on_cran SUITE. 195 of the 271 test files carry skip_on_cran(),
#    which is every test that runs a real fit_mod() optimization. R-CMD-check
#    sets NOT_CRAN=false, so it skips all of them. Note 95 of those carry the
#    call at FILE level, outside any test_that(): such a file produces a
#    zero-row result, so it reports neither a pass nor a skip and disappears
#    from the counts rather than showing up as skipped. test-coverage runs them
#    on every PR, split across shards, and a shard fails when one of its tests
#    does. This job runs the whole suite uninstrumented, serially, every night.
#    NOTE: `schedule` fires on the DEFAULT branch, so on dev this job runs only
#    when dispatched -- otherwise the per-PR coverage shards are the only thing
#    that runs these tests. And it mostly stops at the 300-minute timeout (which reports as
#    `cancelled`): of the eight scheduled runs to 2026-10-21, six did not
#    complete, the last success being 10-14.
#
# All three are slow: golden is four phased fits with newtonsteps, a
# bounds-checked build range-tests every array access, and the full NOT_CRAN
# suite is ~160 minutes of fits. Hence golden runs only on PRs that touch the
# model, and the other two run nightly plus manual.
#
# ALL jobs fail the run. The golden job also runs on a pull request that touches
# the model (src/, R/) or the golden files, so a PR that moves the likelihood is
# red before it merges. The suite and the bounds-checked build run nightly and on
# dispatch only, so a red run there is a signal to read, and it has to be
# visible to be read. The bounds job was
# `continue-on-error` while it could not run, which is exactly why its failure
# went unnoticed from before 5.20.0 to 2026-08-27: the run reported success
# throughout. A case that cannot run is now reported apart from a violation, so
# a red run here means something.
on:
  schedule:
    - cron: "0 5 * * *"   # nightly, 05:00 UTC
  # Golden only (see the `if:` on suite; safebounds needs schedule or its input).
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "R/**"
      - "data/**"
      - "tests/testthat/test-golden-regression.R"
      - "tests/testthat/fixtures/golden-reference.rds"
      - ".github/workflows/deep-checks.yaml"
  workflow_dispatch:
    inputs:
      run_safebounds:
        description: "Also run the bounds-checked build (slow)"
        type: boolean
        default: true

name: deep-checks

permissions: read-all

concurrency:
  group: deep-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    # The last 20 runs took 45 to 89 min, and a timeout reports as cancelled.
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The whole point of this job. R-CMD-check sets this false; covr skips the
      # file separately. Here the golden fits must actually run.
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for TMB
        run: |
          # See R-CMD-check.yaml: an unused third-party apt repo serving a bad
          # index makes apt-get exit 100 and fails this step.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y libgsl-dev libblas-dev liblapack-dev gfortran \
            libssl-dev libcurl4-openssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat, any::pkgload
          needs: check

      # Which machine produced these numbers. Golden compares four objectives
      # against literals and has gone red across platforms before: red on main
      # for weeks over a summation order (NEWS.md, 5.45.1), and the 5.45.0 red
      # was a gradient of 3.5e-4 on ubuntu against 2.5e-5 on macOS (TRAPS.md).
      - name: Machine fingerprint
        run: bash tools/ci/machine-fingerprint.sh
        shell: bash

      - name: Golden reference (four pinned fits)
        run: |
          Rscript -e '
            pkgload::load_all(".", quiet = TRUE)
            # .fit_tmb() uses TMBhelper::fit_tmb when installed and a plain
            # nlminb + Newton fallback otherwise -- a different optimizer, which
            # is a far bigger difference than a summation order. It is a
            # Suggests with a GitHub Remotes entry, so record what this runner
            # actually got.
            cat("TMBhelper installed:",
                requireNamespace("TMBhelper", quietly = TRUE), "\n")
            res <- testthat::test_file("tests/testthat/test-golden-regression.R",
                                       reporter = "summary")
            df <- as.data.frame(res)
            # A file that SKIPPED is not a pass. The guards this job exists to
            # defeat are inside the file, so assert something actually ran.
            cat("\npassed:", sum(df$passed), " failed:", sum(df$failed),
                " skipped:", sum(df$skipped), "\n")
            if (sum(df$passed) == 0)
              stop("golden regression ran no assertions -- it was skipped, ",
                   "which is the failure mode this job exists to prevent")
            # And assert on the GATE by name: the file holds five other tests, so
            # a whole-file count stays positive while the one test that pins the
            # likelihood and the derived quantities is skipped.
            gate <- df[df$test == "the likelihood and derived quantities at the reference parameters are unchanged", ]
            if (nrow(gate) != 1 || sum(gate$passed) == 0)
              stop("the likelihood gate did not run -- it is the point of this job")
            if (sum(df$failed) > 0 || sum(df$error) > 0)
              stop("golden regression failed: the likelihood or a derived quantity at the reference parameters moved")'
        shell: bash

  suite:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # ~160 min measured under covr (tools/ci/coverage-costs.tsv, summed);
    # uninstrumented and serial is less, but leave room for a slow runner.
    timeout-minutes: 300
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      # Config/testthat/parallel is true, and a parallel worker cannot load a
      # DLL load_all() has just rebuilt (see CLAUDE.md). Serial here.
      TESTTHAT_PARALLEL: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for TMB
        run: |
          # See R-CMD-check.yaml: an unused third-party apt repo serving a bad
          # index makes apt-get exit 100 and fails this step.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y libgsl-dev libblas-dev liblapack-dev gfortran \
            libssl-dev libcurl4-openssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat, any::pkgload
          needs: check

      - name: Full suite with NOT_CRAN=true
        run: |
          Rscript -e '
            # Assert the mode before spending two hours in it. NOT_CRAN going
            # false is the failure this job exists to catch, and it would present
            # as a fast green run of nothing but the unguarded unit tests.
            if (!identical(Sys.getenv("NOT_CRAN"), "true"))
              stop("NOT_CRAN is not \"true\" -- every skip_on_cran() test would ",
                   "skip, which is the failure mode this job exists to prevent")
            pkgload::load_all(".", quiet = TRUE)
            res <- testthat::test_dir("tests/testthat", package = "Rceattle",
                                      stop_on_failure = FALSE,
                                      reporter = "summary")
            df <- as.data.frame(res)
            cat("\nfiles:", nrow(df), " passed:", sum(df$passed),
                " failed:", sum(df$failed), " skipped:", sum(df$skipped),
                " errors:", sum(df$error), "\n")
            if (sum(df$passed) == 0)
              stop("the suite ran no assertions")
            if (sum(df$failed) > 0 || sum(df$error) > 0)
              stop("suite failures: ", sum(df$failed), " failed, ",
                   sum(df$error), " errored")'
        shell: bash

  # Windows is the only OS the 0xC0000005 access violation has appeared on, so
  # the bounds-checked build has to run there too. Background: inst/dev/TRAPS.md.
  safebounds:
    runs-on: ${{ matrix.os }}
    name: safebounds (${{ matrix.os }})
    timeout-minutes: 120
    if: ${{ github.event_name == 'schedule' || inputs.run_safebounds }}
    strategy:
      # false: a lost runner on one OS must not cancel the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      RCEATTLE_SAFEBOUNDS: "true"
      # Serial, so a crash is attributable to the file that caused it.
      TESTTHAT_PARALLEL: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for TMB
        if: runner.os == 'Linux'
        run: |
          # See R-CMD-check.yaml: an unused third-party apt repo serving a bad
          # index makes apt-get exit 100 and fails this step.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y libgsl-dev libblas-dev liblapack-dev gfortran \
            libssl-dev libcurl4-openssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat, any::pkgload
          needs: check

      - name: Bounds-checked build and drive
        run: Rscript tools/verify/verify-safebounds.R
        shell: bash

      # The file that crashed on Windows used to be run here, as a second step.
      # It was not bounds-checked: verify-safebounds.R restores the unchecked
      # build on exit, and TMB::compile() is incremental, so the load_all() here
      # no-op'd and the test ran against the ordinary model (ceattle.so's mtime
      # did not move, measured 2026-08-27). It is a case inside the harness now,
      # where it shares the one bounds-checked build.
